# Sara's check: typecheck + every test on Ubuntu with Node 24.
#
# SWITCHED OFF ON PURPOSE. GitHub only runs workflows that live in .github/workflows/, and this
# file is in .github/workflows-disabled/, so nothing runs and nothing is billed. The project owner
# decides when CI runs. With the owner's permission, switch it on with:
#   mkdir -p .github/workflows && git mv .github/workflows-disabled/check.yml .github/workflows/check.yml
# (See CONTRIBUTING.md → "Continuous integration".) Even after moving it, it only runs by hand
# (Actions tab → Check → Run workflow) until the push/pull_request lines below are uncommented.
name: Check

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dev tools
        run: npm ci
      - name: Typecheck and tests
        run: npm run check
      - name: No secrets or private details in the public files
        run: node scripts/public-export.ts --check-only
