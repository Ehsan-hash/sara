name: Feature idea
description: Suggest something new or better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem, in your own words. "When I …, I want to …"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Sara help?
      description: Your idea for it, if you have one. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: checkboxes
    id: rules
    attributes:
      label: Fits the project
      options:
        - label: It works without new runtime dependencies or a paid service (or explains why it can't).
        - label: It keeps the safety layer (AI disclosure, crisis help, the minor-content block) as it is.
