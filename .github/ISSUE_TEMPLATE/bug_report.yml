name: Bug report
description: Something in Sara doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems: please don't use this form.** See SECURITY.md
        (Security tab → Report a vulnerability). Never paste tokens, keys or private conversations.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: I asked her to … and she …, but I expected …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sara version
      description: Settings → Data & health → Health, or `sara status`.
      placeholder: 0.54.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is she installed?
      options:
        - Linux (one-command installer)
        - Docker
        - Windows installer
        - macOS installer
        - From source (npm run dev)
        - Other
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did you see it?
      description: Web app in which browser, phone app, desktop app, Telegram, Discord, sara-chat, VS Code…
  - type: input
    id: model
    attributes:
      label: Model and provider
      description: If it's about her replies or tools, e.g. "qwen3 27B on Ollama" or "Claude on the API".
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Settings → Data & health → Health has recent problems and a log download. Remove anything private first.
      render: text
